name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          if [[ "v$PKG_VERSION" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match package.json version v$PKG_VERSION"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Verify
        run: npm run verify
      - name: Tests
        run: npm test
      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 bundles
      # npm 10.9.x, so upgrade the global npm before the publish call.
      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      # Auth via npm Trusted Publishing (OIDC) - intentionally NO NODE_AUTH_TOKEN.
      - run: npm publish --provenance --access public
