name: CI

on:
  push:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'runtime/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'scripts/colab/**'
      - 'tests/**'
      - 'tests/**/*.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'atlas/**'
      # Codecov reads its status and comment settings from this file.
      - 'codecov.yml'
  # No paths filter on pull requests, deliberately: this workflow emits the
  # required status check, and a PR that matched no path (a docs-only change)
  # would never report it and could never merge. Pushes to main stay
  # paths-gated.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.node-version == 22 && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # Atlas requires Node 22 or later, so the check runs on the 22 cell only.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - run: npm ci --ignore-scripts
      - name: Smoke test — help
        run: node bin/sdlab.js --help
      - name: Smoke test — doctor
        run: node bin/sdlab.js project doctor --project star-freight
      - name: Smoke test — snapshot dry-run
        run: node bin/sdlab.js snapshot create --dry-run --project star-freight
      - name: Smoke test — eligibility
        run: node bin/sdlab.js eligibility audit --project star-freight
      - name: Smoke test — training profiles
        run: node bin/sdlab.js training-profile list --project star-freight
      - name: Verify script
        run: npm run verify
      - name: Tests
        run: npm test
      - name: Coverage (Node 22 only)
        id: tests
        if: matrix.node-version == 22
        run: npm run coverage
        # On the coverage leg the test runner also writes JUnit to junit.xml
        # where it runs; elsewhere the variable is empty, which Node reads as
        # unset.
        env:
          NODE_OPTIONS: ${{ env.COVERAGE_LEG == 'true' && '--test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml' || '' }}
      - name: Python tests and coverage (Node 22 only)
        id: pytest
        if: matrix.node-version == 22
        # uv is installed by hash: only PyPI's uv 0.13.5 manylinux x86_64 wheel (the
        # runner's platform) is accepted, into a throwaway venv (the runner's system
        # Python is externally managed). Only the uv binary goes on PATH, and later
        # steps find it through GITHUB_PATH.
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-bootstrap"
          printf 'uv==0.13.5 --hash=sha256:fa8d26e08e34c29c0c4e820cf3181757086d547240b4f4d31ff1d8bd810ca946\n' > "$RUNNER_TEMP/uv-bootstrap.txt"
          "$RUNNER_TEMP/uv-bootstrap/bin/python" -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r "$RUNNER_TEMP/uv-bootstrap.txt"
          mkdir -p "$RUNNER_TEMP/uv-bin"
          ln -sf "$RUNNER_TEMP/uv-bootstrap/bin/uv" "$RUNNER_TEMP/uv-bin/uv"
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/uv-bin:$HOME/.local/bin:$PATH"
          uv --version
          uv python install 3.14.9 3.12.15
          PY_TARGET=3.14.9
          uv venv .venv-ci --python "${PY_TARGET}"
          uv pip install --python .venv-ci/bin/python pytest pytest-cov
          .venv-ci/bin/python --version
          SDLAB_PYTHON="$(pwd)/.venv-ci/bin/python" .venv-ci/bin/python -m pytest tests/colab tests/checkpoint_eval \
            --cov=scripts/colab \
            --cov=scripts/checkpoint-eval \
            --cov-report=term-missing \
            --cov-report=xml:coverage/coverage-python.xml \
            --cov-fail-under=90
      - name: Colab pre-flight resolve — lane 1 (Node 22 only)
        if: matrix.node-version == 22
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/colab/preflight_resolve.sh lane1
      - name: Colab pre-flight resolve — lane 3 (Node 22 only)
        if: matrix.node-version == 22
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/colab/preflight_resolve.sh lane3 --skip-local-wheels
      # The codecov job below uploads what these steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save Python coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-python-coverage
          path: coverage/coverage-python.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: verify
    if: ${{ !cancelled() && needs.verify.result != 'cancelled' && needs.verify.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codecov-coverage
          path: coverage
      - name: Download Python coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codecov-python-coverage
          path: coverage
      - name: Download test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codecov-test-results
          path: .
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          flags: javascript
          files: ./coverage/lcov.info
      - name: Upload Python coverage to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('coverage/coverage-python.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          flags: python
          files: ./coverage/coverage-python.xml
      - name: Upload test results to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml
