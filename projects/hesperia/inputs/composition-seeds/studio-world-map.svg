<svg viewBox="0 0 680 482" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ht hd">
  <title id="ht">Hesperia — rough world cross-section</title>
  <desc id="hd">A panorama cutaway of the colony world Hesperia. Vertically: the dead unshielded sky with the evening star Hesperos, the sealed arcology towers (now held by Gen-2), the failing terraforming lattice, the corroded under-city (rustline) hub holding the Rust Communion and the home base, and the lethal open surface. Horizontally the surface splits into hazard regions — a polar blizzard front, a toxic unbreathable basin, the safe green-air zones around the hub, the radiation reaches with lattice ruins, and the landed colony ark on the horizon. A dotted path marks Sam's road from the towers down to the Communion. Rough hand-off draft for design polish.</desc>
  <style>
    text{font-family:system-ui,"Segoe UI",Arial,sans-serif;}
    .lbl{fill:#ece8de;font-size:11px;font-weight:700;letter-spacing:.3px;}
    .sub{fill:#bdb7a9;font-size:9px;}
    .tiny{fill:#e2ddd1;font-size:8.5px;}
    .lead{stroke:#bdb7a9;stroke-width:.7;fill:none;}
  </style>

  <rect x="0" y="0" width="680" height="482" fill="#0e0d0a"/>
  <rect x="1" y="1" width="678" height="480" fill="none" stroke="#34322c" stroke-width="1"/>

  <!-- SKY -->
  <rect x="1" y="1" width="678" height="150" fill="#16140f"/>
  <circle cx="70" cy="34" r="1.4" fill="#cbc6b6" opacity=".6"/>
  <circle cx="150" cy="58" r="1" fill="#cbc6b6" opacity=".5"/>
  <circle cx="250" cy="28" r="1.2" fill="#cbc6b6" opacity=".5"/>
  <circle cx="468" cy="30" r="1" fill="#cbc6b6" opacity=".5"/>
  <circle cx="640" cy="60" r="1.3" fill="#cbc6b6" opacity=".55"/>
  <circle cx="588" cy="40" r="15" fill="#c8862f" opacity=".16"/>
  <circle cx="588" cy="40" r="5.5" fill="#c8862f"/>
  <text class="lbl" x="16" y="24">THE UNSHIELDED SKY</text>
  <text class="sub" x="16" y="37">no magnetosphere · the air bleeds to space</text>
  <line class="lead" x1="588" y1="49" x2="588" y2="58"/>
  <text class="sub" x="588" y="68" text-anchor="middle">Hesperos · the evening star</text>

  <!-- TOWERS -->
  <g fill="#6b6e70">
    <rect x="292" y="92" width="18" height="212"/>
    <rect x="314" y="60" width="24" height="244"/>
    <rect x="344" y="46" width="28" height="258"/>
    <rect x="378" y="84" width="20" height="220"/>
  </g>
  <g fill="#c8862f" opacity=".85">
    <rect x="320" y="80" width="3" height="4"/><rect x="328" y="104" width="3" height="4"/>
    <rect x="350" y="70" width="3" height="4"/><rect x="358" y="120" width="3" height="4"/>
    <rect x="296" y="120" width="3" height="4"/><rect x="384" y="110" width="3" height="4"/>
  </g>
  <line x1="358" y1="46" x2="358" y2="34" stroke="#6b6e70" stroke-width="1.2"/>
  <text class="lbl" x="150" y="116">THE TOWERS</text>
  <text class="sub" x="150" y="129">the Sealed - now Gen-2 · the climb</text>
  <line class="lead" x1="236" y1="112" x2="290" y2="116"/>

  <!-- SMOG -->
  <rect x="1" y="150" width="678" height="46" fill="#6b6e70" opacity=".20"/>

  <!-- LATTICE -->
  <g fill="#53575a">
    <rect x="62" y="214" width="9" height="42"/><ellipse cx="66" cy="212" rx="7" ry="4"/>
    <ellipse cx="150" cy="252" rx="34" ry="13"/>
    <rect x="232" y="220" width="8" height="36"/>
    <polygon points="470,256 476,214 486,216 482,256"/>
    <rect x="520" y="218" width="8" height="38"/>
    <ellipse cx="606" cy="252" rx="30" ry="12"/>
  </g>
  <line x1="66" y1="256" x2="240" y2="256" stroke="#53575a" stroke-width="1" opacity=".6"/>
  <text class="lbl" x="16" y="180">THE FAILING LATTICE</text>
  <text class="sub" x="16" y="193">atmosphere scrubbers + greenhouse plants - breaking down</text>

  <!-- UNDER-CITY -->
  <g fill="#7a4a2b">
    <rect x="250" y="320" width="20" height="40"/><rect x="272" y="306" width="16" height="54"/>
    <rect x="290" y="330" width="14" height="30"/><rect x="392" y="318" width="18" height="42"/>
    <rect x="412" y="306" width="16" height="54"/><rect x="430" y="332" width="14" height="28"/>
    <rect x="300" y="338" width="92" height="22" opacity=".7"/>
  </g>
  <g fill="#16140f" opacity=".55">
    <rect x="258" y="328" width="6" height="32"/><rect x="418" y="320" width="6" height="40"/>
  </g>
  <g fill="#c8862f" opacity=".9">
    <rect x="276" y="318" width="3" height="3"/><rect x="280" y="332" width="3" height="3"/>
    <rect x="416" y="318" width="3" height="3"/><rect x="334" y="344" width="3" height="3"/>
    <rect x="358" y="346" width="3" height="3"/>
  </g>
  <text class="lbl" x="120" y="296">THE UNDER-CITY · rustline</text>
  <text class="sub" x="120" y="309">your hub · grime below the towers</text>
  <line class="lead" x1="226" y1="312" x2="252" y2="328"/>
  <text class="tiny" x="298" y="356">Rust Communion</text>
  <text class="tiny" x="372" y="333">home base</text>

  <!-- SURFACE BANDS -->
  <rect x="1" y="360" width="140" height="120" fill="#6b8a99" opacity=".5"/>
  <polygon points="20,360 34,338 48,360" fill="#cbd6da" opacity=".5"/>
  <polygon points="92,360 104,344 116,360" fill="#cbd6da" opacity=".45"/>
  <rect x="141" y="360" width="140" height="120" fill="#5f7048" opacity=".6"/>
  <ellipse cx="200" cy="372" rx="60" ry="10" fill="#7c8a5e" opacity=".4"/>
  <rect x="281" y="360" width="160" height="120" fill="#7a4a2b" opacity=".45"/>
  <ellipse cx="360" cy="372" rx="70" ry="12" fill="#c8862f" opacity=".18"/>
  <rect x="441" y="360" width="131" height="120" fill="#b5502a" opacity=".5"/>
  <polygon points="500,360 508,330 520,332 514,360" fill="#3a2c22" opacity=".8"/>
  <rect x="572" y="360" width="107" height="120" fill="#2f2b24"/>
  <polygon points="588,360 600,330 672,322 668,360" fill="#cbc6b6" opacity=".8"/>
  <polygon points="612,332 660,328 658,344 616,346" fill="#16140f" opacity=".3"/>
  <line x1="1" y1="360" x2="679" y2="360" stroke="#0e0d0a" stroke-width="1.4"/>

  <!-- SAM'S ROAD -->
  <path d="M340 304 Q 322 332 302 350" stroke="#c8862f" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <circle cx="302" cy="350" r="2" fill="#c8862f"/>
  <text class="tiny" x="318" y="324" fill="#e0b878">Sam's road</text>

  <!-- SURFACE LABELS -->
  <text class="lbl" x="70" y="380" text-anchor="middle">POLAR FRONT</text>
  <text class="sub" x="70" y="393" text-anchor="middle">cold · blizzards</text>
  <text class="lbl" x="211" y="380" text-anchor="middle">TOXIC BASIN</text>
  <text class="sub" x="211" y="393" text-anchor="middle">soured air · unbreathable</text>
  <text class="lbl" x="361" y="408" text-anchor="middle">SAFE ZONES</text>
  <text class="sub" x="361" y="421" text-anchor="middle">green-air · home</text>
  <text class="lbl" x="506" y="380" text-anchor="middle">RADIATION REACHES</text>
  <text class="sub" x="506" y="393" text-anchor="middle">hot pockets · lattice ruins</text>
  <text class="lbl" x="625" y="408" text-anchor="middle">THE ARK</text>
  <text class="sub" x="625" y="421" text-anchor="middle">colony origin · relic</text>
  <text class="sub" x="361" y="440" text-anchor="middle" fill="#9c968a">deadlier - spectrum worsens outward - deadlier</text>

  <!-- LEGEND -->
  <rect x="16" y="456" width="11" height="11" rx="2" fill="#6b8a99"/><text class="sub" x="32" y="465">cold / blizzard</text>
  <rect x="150" y="456" width="11" height="11" rx="2" fill="#5f7048"/><text class="sub" x="166" y="465">unbreathable air</text>
  <rect x="296" y="456" width="11" height="11" rx="2" fill="#b5502a"/><text class="sub" x="312" y="465">radiation</text>
  <rect x="400" y="456" width="11" height="11" rx="2" fill="#cbc6b6"/><text class="sub" x="416" y="465">the ark relic</text>
  <text class="sub" x="520" y="465" fill="#9c968a">untinted = safe · hazards are situational</text>
</svg>
